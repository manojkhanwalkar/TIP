template: Hello, %s!
defaultName: Stranger
# Directory holding the encrypted files
filesDirectory: ${FILER_FILES_DIR}
# Maximum size of the base64 encoded upload, in characters
maxFileContentsLength: 10485760

server:
  #  softNofileLimit: 1000
  #  hardNofileLimit: 1000
  applicationConnectors:
    - type: https
      port: 8380
      # Keystore and password come from the environment; nothing secret is kept in the repository.
      keyStorePath: ${TIP_KEYSTORE_PATH}
      keyStorePassword: ${TIP_KEYSTORE_PASSWORD}
  adminConnectors:
    - type: https
      port: 8381
      # admin endpoints (metrics, tasks) are only reachable from the local host
      bindHost: 127.0.0.1
      keyStorePath: ${TIP_KEYSTORE_PATH}
      keyStorePassword: ${TIP_KEYSTORE_PASSWORD}
